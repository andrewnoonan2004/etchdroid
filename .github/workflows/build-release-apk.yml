name: Build Non-Debug Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (foss or gplay)'
        required: true
        default: 'foss'
        type: choice
        options:
          - foss
          - gplay
      create_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  build-release:
    name: Build Non-Debug APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        variant:
          - foss
      fail-fast: false

    env:
      JAVA_TOOL_OPTIONS: "-Xmx4g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Firebase config (for GPlay build if enabled)
        run: |
          mkdir -p app
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF
          if [[ "$(wc -c < app/google-services.json)" -lt 10 ]]; then
            cp misc/mock-google-services.json app/google-services.json
          fi

      - name: Build Optimized & Release APKs
        run: |
          VARIANT="${{ matrix.variant }}"
          ./gradlew "assemble${VARIANT^}Optimized" "assemble${VARIANT^}Release" --configuration-cache
        env:
          ETCHDROID_ENABLE_SENTRY: ${{ matrix.variant == 'gplay' }}

      - name: Sign Release APK
        id: sign_release
        run: |
          VARIANT="${{ matrix.variant }}"
          UNSIGNED_APK=$(find "app/build/outputs/apk/${VARIANT}/release" -name "*release*.apk" | head -n 1)
          SIGNED_APK="app/build/outputs/apk/${VARIANT}/release/EtchDroid-${VARIANT}-release-signed.apk"

          # Find apksigner dynamically in Android SDK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository release keystore secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS || 'key0' }}" \
              --ks-pass "pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}" \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
          else
            echo "Generating CI signing key for installable release distribution..."
            keytool -genkeypair -v -keystore ci-release.keystore \
              -alias ci-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=EtchDroid CI, OU=Mobile, O=EtchDroid, L=Unknown, S=Unknown, C=US"
            "$APKSIGNER" sign \
              --ks ci-release.keystore \
              --ks-key-alias ci-key \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
          fi

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Non-Debug Optimized APK
        uses: actions/upload-artifact@v5
        with:
          name: EtchDroid-${{ matrix.variant }}-optimized-apk
          path: app/build/outputs/apk/${{ matrix.variant }}/optimized/*.apk

      - name: Upload Non-Debug Release APK
        uses: actions/upload-artifact@v5
        with:
          name: EtchDroid-${{ matrix.variant }}-release-signed-apk
          path: ${{ steps.sign_release.outputs.signed_apk }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/${{ matrix.variant }}/optimized/*.apk
            ${{ steps.sign_release.outputs.signed_apk }}
          draft: false
          prerelease: false
          generate_release_notes: true
